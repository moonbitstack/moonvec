name: Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: configure pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      # The reference and the counts are generated from the interface files; a stale page would
      # describe an older library, so the deploy stops instead of publishing it.
      - name: the generated pages are current
        run: |
          python3 scripts/gen_api.py
          python3 scripts/gen_stats.py
          git diff --exit-code -- docs/

      - name: the code on the pages compiles
        run: python3 scripts/check_snippets.py

      # The demos call this build, so it is made here and never checked in.
      - name: build the browser engine
        run: |
          moon build src/examples/browser --target js --release
          mkdir -p docs/engine
          cp _build/js/release/build/examples/browser/browser.js docs/engine/moonvec.js

      - name: upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v5
